[project]
name = "yde-backend"
version = "0.1.0"
description = "Local backend for the YouTube Description Editor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.158",  # app.frontend() serves the built frontend in cloud mode (ADR-0021)
    "uvicorn[standard]>=0.30",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "regex>=2024.7",
    "httpx>=0.27",
    "tzdata>=2024.1",  # Pacific-time quota days on Windows
    "psycopg[binary]>=3.2",  # Postgres when DATABASE_URL is set (ADR-0016)
    "psycopg-pool>=3.2",
    "vercel-blob>=0.5.0",  # Backup copies to a private Vercel Blob store (ADR-0018)
    "cryptography>=42",  # seals the stored Google token with YDE_TOKEN_KEY (ADR-0019)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
screenshots = ["playwright>=1.45"]  # scripts/screenshots.py only

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# The SQL migrations aren't Python files, so they must be listed to be installed with the package (ADR-0021).
"app.store" = ["migrations/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
