[project]
name = "yde-backend"
version = "0.1.0"
description = "Local backend for the YouTube Description Editor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "regex>=2024.7",
    "httpx>=0.27",
    "tzdata>=2024.1",  # Pacific-time quota days on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
